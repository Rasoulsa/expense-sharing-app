name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "false"
      # Public placeholder for the disposable CI job, never a production key.
      SECRET_KEY: ci-only-public-placeholder-never-use-outside-disposable-ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHON_DOTENV_DISABLED: "1"
      SQLITE_PATH: ${{ runner.temp }}/expense-sharing-ci/expenses.sqlite3
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked
      - name: Apply migrations
        run: uv run --locked python manage.py migrate --noinput
      - name: Seed participants
        run: uv run --locked python manage.py seed_participants
      - name: Verify seed can be rerun
        run: uv run --locked python manage.py seed_participants
      - name: Check for missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: uv run --locked python manage.py check
      - name: Run backend tests
        run: uv run --locked pytest -q
      - name: Lint backend
        run: uv run --locked ruff check .
      - name: Check backend formatting
        run: uv run --locked ruff format --check .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend types
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build
