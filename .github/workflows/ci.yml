name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "false"
      # Public placeholder for the disposable CI job, never a production key.
      SECRET_KEY: ci-only-public-placeholder-never-use-outside-disposable-ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHON_DOTENV_DISABLED: "1"
      SQLITE_PATH: /tmp/expense-sharing-ci/expenses.sqlite3
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked
      - name: Apply migrations
        run: uv run --locked python manage.py migrate --noinput
      - name: Seed participants
        run: uv run --locked python manage.py seed_participants
      - name: Verify seed can be rerun
        run: uv run --locked python manage.py seed_participants
      - name: Check for missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: uv run --locked python manage.py check
      - name: Run backend tests
        run: uv run --locked pytest -q
      - name: Lint backend
        run: uv run --locked ruff check .
      - name: Check backend formatting
        run: uv run --locked ruff format --check .

  backend-postgres:
    name: PostgreSQL 17 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable CI credentials, unrelated to Hamravesh.
          POSTGRES_USER: expense_ci
          POSTGRES_PASSWORD: ci-only-public-database-password
          POSTGRES_DB: expense_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_ci -d expense_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "false"
      SECRET_KEY: ci-only-public-placeholder-never-use-outside-disposable-ci
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: postgresql://expense_ci:ci-only-public-database-password@localhost:5432/expense_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked backend dependencies
        run: uv sync --locked
      - name: Verify PostgreSQL backend and server version
        run: >-
          uv run --locked python manage.py shell -c
          "from django.db import connection;
          assert connection.vendor == 'postgresql';
          assert connection.pg_version // 10000 == 17"
      - name: Apply migrations
        run: uv run --locked python manage.py migrate --noinput
      - name: Seed participants
        run: uv run --locked python manage.py seed_participants
      - name: Verify seed can be rerun
        run: uv run --locked python manage.py seed_participants
      - name: Check for missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: uv run --locked python manage.py check
      - name: Run backend tests against PostgreSQL
        run: uv run --locked pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend types
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      DEBUG: "false"
      SECRET_KEY: browser-test-only-public-placeholder-never-use-in-production
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHON_DOTENV_DISABLED: "1"
      VITE_API_BASE_URL: http://127.0.0.1:8001
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser test against Django and Vite
        run: npm run e2e

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python for the HTTP smoke script
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - name: Verify Docker tooling
        run: |
          docker version
          docker compose version
      - name: Build locked backend production image from root
        run: docker build -f backend/Dockerfile -t expense-sharing-backend:day4 .
      - name: Build frontend production image with public test URL from root
        run: >-
          docker build -f frontend/Dockerfile
          --build-arg VITE_API_BASE_URL=http://localhost:8000
          -t expense-sharing-frontend:day4 .
      - name: Start disposable PostgreSQL 17 and frontend
        run: docker compose -f compose.smoke.yml up -d --no-build --wait --wait-timeout 60 db frontend
      - name: Run one-off migrations and idempotent seeds
        run: |
          docker compose -f compose.smoke.yml run --rm backend python manage.py migrate --noinput
          docker compose -f compose.smoke.yml run --rm backend python manage.py seed_participants
          docker compose -f compose.smoke.yml run --rm backend python manage.py seed_participants
      - name: Start backend and review deployment checks
        run: |
          docker compose -f compose.smoke.yml up -d --no-build --wait --wait-timeout 60 backend
          docker compose -f compose.smoke.yml exec -T -e SECURE_SSL_REDIRECT=true backend python manage.py check --deploy
          docker compose -f compose.smoke.yml exec -T backend python manage.py shell -c "from django.db import connection; assert connection.vendor == 'postgresql'; assert connection.pg_version // 10000 == 17"
      - name: Run existing container HTTP and API smoke
        run: python3 backend/scripts/smoke_containers.py
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.smoke.yml ps --all
          docker compose -f compose.smoke.yml logs --no-color --tail 200
      - name: Remove disposable containers and database
        if: always()
        run: docker compose -f compose.smoke.yml down --volumes --remove-orphans
